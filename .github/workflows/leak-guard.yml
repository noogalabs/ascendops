name: PR Safety Gates

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  leak-guard:
    name: Leak Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prove leak guard blocks poisoned inputs
        run: |
          bash tests/leak-guard.test.sh
          bash tests/leak-guard-adversarial.test.sh

      - name: Scan full pull-request diff
        run: |
          set -o pipefail
          # BEGIN leak-guard-subject-filter
          # Only content-bearing blob and symlink modes are scanner subjects.
          # Gitlinks are tracked commit references, not file content.
          filter_scannable_changed_subjects() {
            local ref="$1" f mode staged
            staged=$(mktemp "${RUNNER_TEMP:-/tmp}/leak-guard-changed.XXXXXX")
            while IFS= read -r -d '' f; do
              if ! mode=$(git ls-tree --format='%(objectmode)' "$ref" -- "$f") || [ -z "$mode" ]; then
                rm -f "$staged"
                echo "::error::Unable to resolve changed scan subject in $ref: $f" >&2
                return 2
              fi
              case "$mode" in
                100644|100755|120000) printf '%s\0' "$f" >> "$staged" ;;
              esac
            done
            cat "$staged"
            rm -f "$staged"
          }
          list_scannable_tree_subjects() {
            local ref="$1" entry mode path tree_list staged
            tree_list=$(mktemp "${RUNNER_TEMP:-/tmp}/leak-guard-tree.XXXXXX")
            staged=$(mktemp "${RUNNER_TEMP:-/tmp}/leak-guard-subjects.XXXXXX")
            if ! git ls-tree -r -z "$ref" > "$tree_list"; then
              rm -f "$tree_list" "$staged"
              echo "::error::Unable to enumerate scan subjects in tree $ref" >&2
              return 2
            fi
            while IFS= read -r -d '' entry; do
              mode=${entry%% *}
              path=${entry#*$'\t'}
              case "$mode" in
                100644|100755|120000) printf '%s\0' "$path" >> "$staged" ;;
              esac
            done < "$tree_list"
            cat "$staged"
            rm -f "$tree_list" "$staged"
          }
          # END leak-guard-subject-filter

          subjects=$(mktemp "${RUNNER_TEMP:-/tmp}/leak-guard-pr-subjects.XXXXXX")
          git diff --name-only -z --diff-filter=ACMRTUXB \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            | filter_scannable_changed_subjects "${{ github.event.pull_request.head.sha }}" \
            > "$subjects"
          list_scannable_tree_subjects "${{ github.event.pull_request.head.sha }}" > /dev/null
          rm -f "$subjects"

          bash .github/scripts/leak-guard.sh --diff \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

  scope-reconcile:
    name: Scope Reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Prove scope reconciliation blocks a mismatch
        run: bash tests/scope-reconcile.test.sh

      - name: Fetch complete GitHub PR file list
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh api --paginate --slurp
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100"
          > "$RUNNER_TEMP/pr-files.json"

      - name: Reconcile API file list with full base...head diff
        run: >-
          python3 .github/scripts/scope-reconcile.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --github-files-json "$RUNNER_TEMP/pr-files.json"
